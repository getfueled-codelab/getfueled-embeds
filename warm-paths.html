<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Warm paths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-title: rgba(0,0,0,0.95); --ink-body: rgba(0,0,0,0.62);
    --ink-caption: rgba(0,0,0,0.45); --ink-faint: rgba(0,0,0,0.30);
    --hairline: rgba(0,0,0,0.08); --surface: #ffffff; --sunken: #f7f7f7;
    --signal: #2a78d6; --signal-deep: #1d5aa8; --signal-tint: #eef3fb;
    --shadow-rest: 0 1px 3px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: Inter, -apple-system, 'system-ui', 'Segoe UI', Roboto, sans-serif;
    color: var(--ink-body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; padding: 3px;
  }
  .card { background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; box-shadow: var(--shadow-rest);
    padding: 12px 16px 12px; max-width: 680px; margin: 0 auto; }

  .top { display: flex; align-items: center; justify-content: space-between;
    gap: 8px; }
  .chip { display: inline-block; background: var(--sunken);
    border: 1px solid var(--hairline); color: var(--ink-body);
    font-size: 11px; font-weight: 600; letter-spacing: .02em;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .nav { display: flex; align-items: center; gap: 6px; }
  .count { font-size: 12px; color: var(--ink-caption);
    font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
  .arrow { width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink-body); font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; line-height: 1; }
  .arrow:hover:not(:disabled) { background: var(--sunken); }
  .arrow:disabled { opacity: .3; cursor: default; }

  .slide { transition: opacity .16s ease, transform .16s ease; }
  .slide.out { opacity: 0; transform: translateX(6px); }

  .chain { display: flex; align-items: flex-start; padding: 14px 2px 4px; }
  .node { flex: 1 1 96px; min-width: 0; max-width: 150px; display: flex;
    flex-direction: column; align-items: center; text-align: center; }
  .avatar { width: 40px; height: 40px; display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 600; flex: 0 0 auto; }
  .avatar.team { border-radius: 999px; background: var(--signal-tint);
    border: 1.5px solid var(--signal); color: var(--signal-deep); }
  .avatar.person { border-radius: 999px; background: var(--sunken);
    border: 1px solid var(--hairline); color: var(--ink-body); }
  .avatar.investor { border-radius: 10px; background: #161616; color: #fff; }
  .avatar.company { border-radius: 10px; background: var(--sunken);
    border: 1px solid var(--hairline); color: var(--ink-caption); }
  .node .nm { margin: 7px -12px 0; font-size: 13px; font-weight: 600;
    color: var(--ink-title); line-height: 1.3; overflow-wrap: break-word; }
  .node .rl { margin: 1px -12px 0; font-size: 11.5px; color: var(--ink-caption);
    line-height: 1.3; overflow-wrap: break-word; }
  .node:first-child .nm, .node:first-child .rl { margin-left: 0; }
  .node:last-child .nm, .node:last-child .rl { margin-right: 0; }
  .link { flex: 1 1 48px; position: relative; height: 40px; min-width: 24px;
    margin: 0 4px; }
  .link .lbl { position: absolute; left: -14px; right: -14px; bottom: 23px;
    max-height: 28px; overflow: hidden; display: flex; align-items: flex-end;
    justify-content: center; text-align: center; font-size: 11.5px;
    color: var(--ink-caption); line-height: 1.2; }
  .link .line { position: absolute; left: 0; right: 0; top: 19px;
    border-top: 2px solid rgba(0,0,0,0.14); }
  .link .line.dashed { border-top-style: dashed; }

  .foot { display: flex; align-items: center; justify-content: space-between;
    gap: 12px; border-top: 1px solid var(--hairline); margin-top: 10px;
    padding-top: 10px; }
  .fact { font-size: 12.5px; color: var(--ink-caption); min-width: 0; }
  .btn { flex: 0 0 auto; display: inline-block; background: var(--signal-tint);
    color: var(--signal-deep); font-size: 12.5px; font-weight: 600;
    padding: 7px 12px; border-radius: 9px; text-decoration: none;
    white-space: nowrap; }
  .btn:hover { background: #e3edf9; }

  .empty { border: 1px dashed var(--hairline); border-radius: 12px;
    background: var(--surface); padding: 22px 16px; text-align: center;
    max-width: 680px; margin: 0 auto; }
  .empty .t { font-size: 13.5px; font-weight: 600; color: var(--ink-title); }
  .empty .s { font-size: 12.5px; color: var(--ink-caption); margin-top: 3px; }
  .loading { padding: 26px 16px; text-align: center; color: var(--ink-caption);
    font-size: 12.5px; }

  @media (max-width: 420px) {
    .card { padding: 10px 10px 10px; }
    .node { flex-basis: 64px; max-width: 100px; }
    .avatar { width: 34px; height: 34px; font-size: 12px; }
    .link { height: 34px; min-width: 18px; margin: 0 2px; }
    .link .line { top: 16px; }
    .link .lbl { bottom: 20px; font-size: 10px; max-height: 24px;
      left: -10px; right: -10px; }
    .node .nm { font-size: 12px; }
    .node .rl { font-size: 10.5px; }
    .foot { gap: 8px; }
    .fact { font-size: 11.5px; }
    .btn { font-size: 11.5px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script>
(function () {
  "use strict";

  var app = document.getElementById("app");

  var BUILDING_SVG =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 21h18M5 21V6.5L12 4v17M12 21h7V10l-7-2.2"/>' +
    '<path d="M8 9h.01M8 12.5h.01M8 16h.01M15.5 13h.01M15.5 16h.01"/></svg>';

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function message(title, sub) {
    app.innerHTML = '<div class="empty"><div class="t">' + esc(title) +
      '</div><div class="s">' + esc(sub) + "</div></div>";
  }

  function personInitials(first, last, full) {
    var f = (first || full || "?").trim();
    var b = (last || "").trim().charAt(0) ||
      ((full || "").split(/\s+/)[1] || "").charAt(0) || "";
    return ((f.charAt(0) + b).toUpperCase()) || "?";
  }

  // Split a connector cell into individual people ("Joris & Bart" is one cell
  // in older data; newer data has one full name per row).
  function splitConnectors(s) {
    return String(s || "").split(/[&+,]| and /i)
      .map(function (p) { return p.trim(); }).filter(Boolean);
  }

  function firstName(name) {
    return (name.split(/\s+/)[0] || name);
  }

  function connectorDisplay(names) {
    if (names.length === 0) return { label: "Your team", initials: "?" };
    if (names.length === 1) {
      var words = names[0].split(/\s+/).filter(Boolean);
      var lastInitial = words.length > 1 ? words[words.length - 1].charAt(0) : "";
      return {
        label: names[0],
        initials: (words[0].charAt(0) + lastInitial).toUpperCase(),
      };
    }
    return {
      label: names.map(firstName).join(" & "),
      initials: names.map(function (n) { return n.charAt(0).toUpperCase(); })
        .join("").slice(0, 3),
    };
  }

  // One card per person per investor: merge connectors, keep the most
  // informative variant (in-database beats not, founder beats employee).
  function dedupe(rows) {
    var byPerson = {};
    var order = [];
    rows.forEach(function (r) {
      var key = String(r.full_name || "").trim().toLowerCase()
        .replace(/,?\s*(phd|md|mba|msc|dr\.?)\.?$/i, "").trim();
      if (!key) return;
      if (!Object.prototype.hasOwnProperty.call(byPerson, key)) {
        byPerson[key] = { rows: [], connectors: [], connectorKeys: {} };
        order.push(key);
      }
      var g = byPerson[key];
      g.rows.push(r);
      splitConnectors(r.connector).forEach(function (name) {
        var ck = name.toLowerCase();
        if (!g.connectorKeys[ck]) { g.connectorKeys[ck] = true; g.connectors.push(name); }
      });
    });
    return order.map(function (key) {
      var g = byPerson[key];
      g.rows.sort(function (a, b) { return (a.tier || 9) - (b.tier || 9); });
      var best = g.rows[0];
      var withUrl = g.rows.filter(function (r) { return (r.linkedin_url || "").trim(); })[0];
      var withCo = g.rows.filter(function (r) { return (r.portfolio_company || "").trim(); })[0];
      var withTitle = g.rows.filter(function (r) { return (r.job_title || "").trim(); })[0];
      return {
        tier: best.tier,
        group: best.tier <= 2 ? "direct" : "portfolio",
        full_name: best.full_name,
        first_name: best.first_name,
        last_name: best.last_name,
        job_title: withTitle ? withTitle.job_title : "",
        linkedin_url: withUrl ? withUrl.linkedin_url : "",
        portfolio_company: withCo ? withCo.portfolio_company : "",
        investor_name: best.investor_name || "",
        connectors: g.connectors,
      };
    }).sort(function (a, b) {
      if (a.group !== b.group) return a.group === "direct" ? -1 : 1;
      return a.full_name.localeCompare(b.full_name);
    });
  }

  function linkedinHref(c) {
    var url = (c.linkedin_url || "").trim();
    if (/^https:\/\/([a-z0-9-]+\.)?linkedin\.com\//i.test(url)) return url;
    var kw = (c.full_name + " " + (c.portfolio_company || c.investor_name || "")).trim();
    return "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(kw);
  }

  function endNode(c) {
    if (c.group === "direct") {
      return '<div class="node"><div class="avatar investor">' +
        esc((c.investor_name || "?").charAt(0).toUpperCase()) + "</div>" +
        '<div class="nm">' + esc(c.investor_name || "Investor") + "</div></div>";
    }
    var co = (c.portfolio_company || "").trim();
    return '<div class="node"><div class="avatar company">' + BUILDING_SVG + "</div>" +
      '<div class="nm">' + esc(co || "Portfolio company") + "</div>" +
      (co ? '<div class="rl">portfolio company</div>' : "") + "</div>";
  }

  function cardHtml(c, idx, total) {
    var conn = connectorDisplay(c.connectors);
    var secondLabel = c.tier === 3 ? "founded" : "works at";
    var dashed = c.tier !== 1;
    var chipText = c.group === "direct" ? "Direct connection" : "Portfolio connection";
    var fact = c.tier === 1 ? "In your contact database" : "Not in your contact database yet";
    var nav = total > 1 ?
      '<div class="nav">' +
      '<button class="arrow" id="prev" aria-label="Previous"' + (idx === 0 ? " disabled" : "") + ">&#8249;</button>" +
      '<span class="count">' + (idx + 1) + " / " + total + "</span>" +
      '<button class="arrow" id="next" aria-label="Next"' + (idx === total - 1 ? " disabled" : "") + ">&#8250;</button>" +
      "</div>" : "";
    return '<div class="card"><div class="slide" id="slide">' +
      '<div class="top"><span class="chip">' + chipText + "</span>" + nav + "</div>" +
      '<div class="chain">' +
      '<div class="node"><div class="avatar team">' + esc(conn.initials) + "</div>" +
      '<div class="nm">' + esc(conn.label) + '</div><div class="rl">your team</div></div>' +
      '<div class="link"><div class="lbl">knows</div><div class="line"></div></div>' +
      '<div class="node"><div class="avatar person">' +
      esc(personInitials(c.first_name, c.last_name, c.full_name)) + "</div>" +
      '<div class="nm">' + esc(c.full_name) + '</div><div class="rl">' +
      esc(c.job_title || "") + "</div></div>" +
      '<div class="link"><div class="lbl">' + esc(secondLabel) + '</div>' +
      '<div class="line' + (dashed ? " dashed" : "") + '"></div></div>' +
      endNode(c) +
      "</div>" +
      '<div class="foot"><span class="fact">' + esc(fact) + "</span>" +
      '<a class="btn" href="' + esc(linkedinHref(c)) +
      '" target="_blank" rel="noopener noreferrer">View on LinkedIn</a></div>' +
      "</div></div>";
  }

  var cards = [];
  var idx = 0;

  function show(newIdx, animate) {
    idx = Math.max(0, Math.min(cards.length - 1, newIdx));
    var paint = function () {
      app.innerHTML = cardHtml(cards[idx], idx, cards.length);
      var prev = document.getElementById("prev");
      var next = document.getElementById("next");
      if (prev) prev.onclick = function () { show(idx - 1, true); };
      if (next) next.onclick = function () { show(idx + 1, true); };
    };
    if (!animate) return paint();
    var slide = document.getElementById("slide");
    if (slide) slide.className = "slide out";
    setTimeout(paint, 90);
  }

  document.addEventListener("keydown", function (e) {
    if (!cards.length) return;
    if (e.key === "ArrowLeft") show(idx - 1, true);
    if (e.key === "ArrowRight") show(idx + 1, true);
  });

  var touchX = null;
  document.addEventListener("touchstart", function (e) {
    touchX = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX == null || !cards.length) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (dx > 40) show(idx - 1, true);
    if (dx < -40) show(idx + 1, true);
  }, { passive: true });

  var qp = new URLSearchParams(location.search);
  var client = (qp.get("client") || "").trim();
  var investor = (qp.get("investor") || "").trim();
  var token = (qp.get("token") || "").trim();

  if (!client || !investor || !token) {
    message("Missing link details",
      "This embed needs client, investor and token parameters. Rebuild the URL in the Glide template column.");
    return;
  }

  var apiOrigin = /\.supabase\./.test(location.origin) ? location.origin
    : "https://xnfczguftihnetbfrvmy.supabase.co";
  var apiUrl = apiOrigin + "/functions/v1/warm-paths?" +
    new URLSearchParams({ client: client, investor: investor, token: token }).toString();

  fetch(apiUrl)
    .then(function (res) {
      if (res.status === 403) {
        message("This link is not valid",
          "The access token does not match this client. Check the token column in Glide or rotate the client token.");
        return null;
      }
      if (!res.ok) throw new Error("api " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (!data) return;
      cards = dedupe(data.rows || []);
      if (!cards.length) {
        message("No mapped connections yet",
          "Your team's network scan has not found a path to this investor so far.");
        return;
      }
      show(0, false);
    })
    .catch(function () {
      message("Something went wrong", "Please try again in a moment.");
    });
})();
</script>
</body>
</html>
